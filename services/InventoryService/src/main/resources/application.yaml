management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics,info

  endpoint:
    health:
      show-details: always

  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    root: INFO
    org.springframework.kafka: INFO
    org.hibernate.SQL: DEBUG

server:
  port: 8083