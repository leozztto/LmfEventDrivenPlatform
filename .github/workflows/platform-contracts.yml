name: platform-contracts

# CI isolado do módulo `shared/contracts`. Dispara só quando este módulo
# (ou algo de que ele depende) muda. Build via .github/workflows/_build-module.yml.

on:
  push:
    branches: [main, develop]
    paths:
      - 'shared/contracts/**'
      - 'pom.xml'
      - '.mvn/**'
      - 'mvnw'
      - 'mvnw.cmd'
      - '.github/workflows/platform-contracts.yml'
      - '.github/workflows/_build-module.yml'
  pull_request:
    paths:
      - 'shared/contracts/**'
      - 'pom.xml'
      - '.mvn/**'
      - 'mvnw'
      - 'mvnw.cmd'
      - '.github/workflows/platform-contracts.yml'
      - '.github/workflows/_build-module.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-contracts-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: ./.github/workflows/_build-module.yml
    with:
      module: shared/contracts
