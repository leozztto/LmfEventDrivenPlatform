spring:
  application:
    name: inventory-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventoryservice}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    # classpath:db/migration varre recursivamente — inclui as migrações do platform-messaging
    # (db/migration/platform/*) que vêm no jar.
    locations: classpath:db/migration

  jackson:
    deserialization:
      fail-on-unknown-properties: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

    consumer:
      group-id: inventory-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.lmf.platform.contracts"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.lmf.platform.contracts.FraudApprovedEvent

    template:
      observation-enabled: true
    listener:
      observation-enabled: true
      ack-mode: record

platform:
  outbox:
    poll-interval-ms: 5000
    dlt-topic: inventory.reservation.dlt

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics,info

  endpoint:
    health:
      show-details: always

  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    root: INFO
    org.springframework.kafka: INFO
    org.hibernate.SQL: DEBUG

server:
  port: 8083
