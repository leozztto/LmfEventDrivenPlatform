spring:
  application:
    name: PaymentService

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/paymentservice}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    # varre recursivamente — inclui db/migration/platform/* do platform-messaging.
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      group-id: payment-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        spring.json.trusted.packages: "com.lmf.platform.contracts"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.lmf.platform.contracts.InventoryReservedEvent

    producer:
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

    template:
      observation-enabled: true
    listener:
      observation-enabled: true
      ack-mode: record

platform:
  outbox:
    poll-interval-ms: 30000
    dlt-topic: payment.outbox.dlt

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics,info

  endpoint:
    health:
      show-details: always

  prometheus:
    metrics:
      export:
        enabled: true

  tracing:
    sampling:
      probability: 1.0

server:
  port: 8082

logging:
  pattern:
    console: >
      %d{yyyy-MM-dd HH:mm:ss}
      [%thread]
      %-5level
      traceId=%X{traceId}
      correlationId=%X{correlationId}
      %logger{36}
      - %msg%n